name: Daily forecast

on:
  schedule:
    - cron: "30 9 * * *"
  workflow_dispatch:

# actions: write is required for the explicit deploy.yml dispatch at the end
permissions:
  contents: write
  actions: write

concurrency:
  group: daily-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt

      - name: Install
        run: pip install -e . -c constraints.txt

      - name: Download the serving models
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download models-latest --dir trained_models

      - name: Run the daily forecast
        run: python -m src.pipelines.daily_forecast

      - name: Grade the logged vintages
        run: python -m src.evaluation.grade_vintages

      - name: Commit the forecast artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/live_forecasts.json frontend/public/data/monitoring.json data/live
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "forecast: daily update $(date -u +%F)"
          git pull --rebase origin main
          git push origin main

      # pushes made with GITHUB_TOKEN never trigger push-event workflows, so
      # the Pages deploy is dispatched explicitly
      - name: Deploy the dashboard
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
