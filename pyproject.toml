[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "flight-delay-forecasting"
version = "0.1.0"
description = "Daily arrival-delay forecasting for the 50 busiest US flight routes"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyarrow>=14.0.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "joblib>=1.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.13.0",
    "optuna>=3.5.0",
    "requests>=2.31.0",
    "tqdm>=4.66.0",
    "python-dateutil>=2.8.0",
    "holidays>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
dl = [
    "torch>=2.0.0",
    "prophet>=1.1.0",
]
serve = [
    "fastapi>=0.110",
    "mangum>=0.17",
    "uvicorn>=0.29",
]
track = [
    "mlflow>=2.12",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
